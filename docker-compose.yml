version: '3.8'

services:
  clickup-app:
    build: .
    container_name: clickup-app
    restart: always
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - ASSET_URL=${ASSET_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CLICKUP_API_KEY=${CLICKUP_API_KEY}
      - CLICKUP_VERIFY_SSL=${CLICKUP_VERIFY_SSL}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - CACHE_STORE=${CACHE_STORE}
    depends_on:
      - clickup-db
    networks:
      - proxy
      - clickup-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clickup.rule=Host(`web-support-portal.lmd.co.id`) && PathPrefix(`/clickup`)"
      - "traefik.http.middlewares.clickup-strip.stripprefix.prefixes=/clickup"
      - "traefik.http.middlewares.clickup-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/clickup"
      - "traefik.http.routers.clickup.middlewares=clickup-strip,clickup-prefix"
      - "traefik.http.routers.clickup.entrypoints=websecure"
      - "traefik.http.routers.clickup.tls=true"
      - "traefik.http.services.clickup.loadbalancer.server.port=80"

  clickup-db:
    image: mysql:8.0
    container_name: clickup-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - clickup-db-data:/var/lib/mysql
    networks:
      - clickup-internal

networks:
  proxy:
    external: true
  clickup-internal:
    driver: bridge

volumes:
  clickup-db-data:
